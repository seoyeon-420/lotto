<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>미사 성가 추천</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="{{ url_for('static', filename='category_browser.js') }}" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="성가책 메뉴">
      <div class="brand-mobile">성가 추천</div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16 16 5 5"/></svg>
        <input id="bookSearch" type="search" placeholder="성가책 검색" aria-label="성가책 검색" />
      </div>
      <nav id="bookList" class="book-list" aria-label="성가책 선택"></nav>
      <section class="sidebar-categories">
        <h3>카테고리별 성가 보기</h3>
        <div id="categoryList"></div>
        <button id="backToRecommend" type="button">성가 추천으로 돌아가기</button>
      </section>
    </aside>

    <main class="content">
      <section id="recommendView">
        <div class="content-inner">
          <section class="search-card" aria-labelledby="formTitle">
            <h1 id="formTitle">전례문 반영 비율 설정</h1>
            <p class="field-help">미사 순서별로 참고할 전례문과 비율을 지정하세요. 각 순서마다 최대 4개까지 추가할 수 있습니다.</p>
            <div id="configTabs" class="config-tabs" role="tablist" aria-label="미사 순서 선택"></div>
            <div id="weightRows" class="weight-rows"></div>
            <button id="addSectionBtn" class="add-section" type="button">＋ 전례 추가하기</button>
            <div class="weight-summary"><span>반영 비율 합계</span><strong id="weightTotal">100%</strong></div>
            <p id="weightHelp" class="field-help" role="status">각 순서의 합계를 100%로 맞춰 주세요.</p>
            <label class="date-label" for="dateInput">날짜 선택</label>
            <div class="date-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/></svg>
              <input id="dateInput" type="text" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" placeholder="YYYYMMDD (8자리)" autocomplete="off" aria-describedby="dateHelp" required />
            </div>
            <p id="dateHelp" class="field-help">예: 20261020 · 숫자 8자리 직접 입력</p>
            <button class="primary" id="submitBtn" type="button">추천받기</button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
          </section>

          <section id="results" class="results hidden" aria-live="polite">
            <div class="results-header"><div><div class="eyebrow">추천 결과</div><h2 id="resultTitle">매일미사</h2></div><span id="resultDate" class="date-pill"></span></div>
            <p id="resultNote" class="result-note"></p>
            <div id="tabs" class="tabs" role="tablist" aria-label="미사 순서"></div>
            <div id="songResults" class="song-results"></div>
          </section>
        </div>
      </section>
      <section id="categoryView" hidden>
        <div class="content-inner">
          <h2 id="categoryTitle"></h2>
          <p id="categorySummary"></p>
          <div id="categoryHymns"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
